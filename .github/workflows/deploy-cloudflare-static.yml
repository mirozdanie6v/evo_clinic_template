name: Remove EVO from Cloudflare
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  remove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Delete EVO Worker
        run: printf 'y\n' | npx --yes wrangler@latest delete --name evo-clinic-template
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 3972de85ae8b3d2ee3e0d35ecf7ca358
