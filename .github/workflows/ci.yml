name: CI
on:
  pull_request:
    branches: [develop, production]
  push:
    branches: [develop]

concurrency:
  group: evo-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Guard production structure, full EVO catalog and demo-only suite
        shell: bash
        run: |
          set -euo pipefail
          test ! -e public/index.html
          test ! -e app-data.js
          test ! -d site
          test ! -d static
          grep -q 'from "../data/evo"' app/page.tsx
          grep -q 'font-size:16px' app/globals.css
          grep -q 'serviceTranslations' data/evo.ts
          grep -q 'brandLogoUrl' app/page.tsx
          grep -q '@evo_vn' app/page.tsx
          grep -q 'OFFICIAL_BOOKING_COMPANY_ID=1258225' data/evo.ts
          grep -q 'service-group-grid' app/page.tsx
          grep -q 'booking-group-filter' app/page.tsx
          grep -q '"hair"' data/evo.ts
          grep -q '"nails"' data/evo.ts
          grep -q '"laser"' data/evo.ts
          grep -q '"brows-pmu"' data/evo.ts
          grep -q '"tattoo-body"' data/evo.ts
          grep -q '"cosmetology"' data/evo.ts
          test -f app/demo-ai-consultant.tsx
          test -f app/demo-admin.tsx
          test -f data/demo-ai-scenarios.ts
          grep -q 'DemoAiConsultant' app/page.tsx
          grep -q 'DemoAdmin' app/page.tsx
          grep -q 'NO REAL AI' app/demo-ai-consultant.tsx
          grep -q 'DEMO ADMIN' app/demo-admin.tsx
          ! grep -Eq 'fetch\(|/api/' app/demo-ai-consultant.tsx app/demo-admin.tsx data/demo-ai-scenarios.ts
          ! grep -Eiq 'caries|root-canal|veneer-crown|digital-smile|implantation|kids-caries' data/evo.ts
          node <<'NODE'
          const x=require('./data/altegio-snapshot.json');
          if(x.meta.sourceLocationId!==251848) throw new Error('Expected EVO NORTH snapshot');
          if(x.meta.scope!=='EVO NORTH full public catalog') throw new Error(`Unexpected scope: ${x.meta.scope}`);
          if(!String(x.meta.extractedAt).startsWith('2026-08-25')) throw new Error('Altegio snapshot is not the validated 2026-08-25 refresh');
          if(x.categories.length<40) throw new Error(`Full EVO catalog too small: ${x.categories.length} categories`);
          if(x.services.length<250) throw new Error(`Full EVO catalog too small: ${x.services.length} services`);
          if(x.specialists.length<10) throw new Error(`Too few EVO specialists: ${x.specialists.length}`);
          const required=['Стрижки / Укладки','Маникюр','Подология','Перманентный макияж','Женская эпиляция','Удаление тату лазером','Массаж','Ботулинотерапия'];
          const names=new Set(x.categories.map(c=>c.title));
          for(const name of required) if(!names.has(name)) throw new Error(`Missing EVO direction: ${name}`);
          const serviceTitles=new Set(x.services.map(s=>s.title));
          if(![...serviceTitles].some(x=>x.includes('Художественная татуировка'))) throw new Error('Art tattoo service missing');
          console.log('Full EVO catalog + demo suite guard OK',x.stats);
          NODE
      - run: npm run build
      - name: Local runtime smoke
        shell: bash
        run: |
          set -euo pipefail
          npm start -- -p 3000 >/tmp/evo-next.log 2>&1 &
          PID=$!
          trap 'kill $PID || true' EXIT
          for attempt in 1 2 3 4 5 6 7 8; do
            if curl -fsS http://127.0.0.1:3000/ -o /tmp/evo-home.html; then break; fi
            sleep 2
          done
          test -s /tmp/evo-home.html
          grep -q 'EVO Beauty Space' /tmp/evo-home.html
          grep -q '/_next/static/' /tmp/evo-home.html
      - name: Install mobile browser engines
        run: npx playwright install --with-deps chromium webkit
      - name: Android Chromium + iPhone WebKit E2E
        run: npm run test:e2e
