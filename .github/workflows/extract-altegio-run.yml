name: Run EVO Altegio extraction

on:
  push:
    paths:
      - 'altegio-trigger.txt'

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Extract EVO Altegio catalog
        env:
          ALTEGIO_BOOKING_URL: https://n1324284.alteg.io/company/1258225/personal/menu?o=
          ALTEGIO_OUT_DIR: artifacts/altegio
          ALTEGIO_MAX_CLICKS: '100'
        run: node tools/altegio-extractor.mjs
      - name: Upload extraction artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evo-altegio-catalog
          path: artifacts/altegio
          if-no-files-found: warn
          retention-days: 14
