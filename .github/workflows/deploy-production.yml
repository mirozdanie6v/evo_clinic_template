name: Deploy production to Cloudflare
on:
  push:
    branches: [production]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify production HTML and CSS
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://evo-beauty-miniapp.mirozdanie6v.workers.dev'
          for attempt in 1 2 3 4 5 6; do
            curl -sS -L -D home.headers -o home.html "$BASE/?smoke=${GITHUB_SHA}-${attempt}"
            CSS_PATH=$(grep -oE '/_next/static/[^" ]+\.css' home.html | head -n1 || true)
            if [ -n "$CSS_PATH" ]; then
              break
            fi
            sleep 5
          done
          test -n "$CSS_PATH" || { echo 'No Next.js CSS reference in production HTML'; head -c 1200 home.html; exit 2; }
          curl -sS -L -D css.headers -o css.body "$BASE$CSS_PATH"
          grep -qi '^content-type: text/css' css.headers || { echo 'Production CSS has invalid content-type'; cat css.headers; exit 3; }
          test -s css.body || { echo 'Production CSS body is empty'; exit 4; }
          grep -q ':root' css.body || { echo 'Expected global CSS not found in production asset'; head -c 500 css.body; exit 5; }
          echo "Production CSS verified: $CSS_PATH"
