name: Deploy production to Cloudflare
on:
  push:
    branches: [production]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify production HTML CSS and JS
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://evo-beauty-miniapp.mirozdanie6v.workers.dev'
          for attempt in 1 2 3 4 5 6; do
            curl -sS -L -D home.headers -o home.html "$BASE/?smoke=${GITHUB_SHA}-${attempt}"
            CSS_PATH=$(grep -oE '/_next/static/[^" ]+\.css' home.html | head -n1 || true)
            JS_PATH=$(grep -oE '/_next/static/[^" ]+\.js' home.html | head -n1 || true)
            if [ -n "$CSS_PATH" ] && [ -n "$JS_PATH" ]; then break; fi
            sleep 5
          done
          grep -q 'EVO Beauty Space' home.html || { echo 'Expected EVO app markup not found'; head -c 1500 home.html; exit 2; }
          ! grep -q 'href="styles.css"' home.html || { echo 'Legacy static HTML is being served'; exit 3; }
          test -n "$CSS_PATH" || { echo 'No Next.js CSS reference'; exit 4; }
          test -n "$JS_PATH" || { echo 'No Next.js JS reference'; exit 5; }
          curl -sS -L -D css.headers -o css.body "$BASE$CSS_PATH"
          grep -qi '^content-type: text/css' css.headers || { echo 'Production CSS has invalid content-type'; cat css.headers; exit 6; }
          test -s css.body || { echo 'Production CSS body is empty'; exit 7; }
          grep -q ':root' css.body || { echo 'Expected global CSS not found'; exit 8; }
          curl -sS -L -D js.headers -o js.body "$BASE$JS_PATH"
          grep -Eqi '^content-type: (application|text)/(javascript|x-javascript)' js.headers || { echo 'Production JS has invalid content-type'; cat js.headers; exit 9; }
          test -s js.body || { echo 'Production JS body is empty'; exit 10; }
          echo "Production assets verified: $CSS_PATH $JS_PATH"
