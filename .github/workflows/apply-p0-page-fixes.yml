name: Apply P0 page fixes
on:
  push:
    branches: [develop]
    paths:
      - 'tools/apply-p0-page-fixes.mjs'
      - '.github/workflows/apply-p0-page-fixes.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch page
        run: node tools/apply-p0-page-fixes.mjs
      - name: Remove one-time patch tooling
        run: rm tools/apply-p0-page-fixes.mjs .github/workflows/apply-p0-page-fixes.yml
      - name: Commit fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/page.tsx tools/apply-p0-page-fixes.mjs .github/workflows/apply-p0-page-fixes.yml
          git commit -m 'Fix booking and catalog UX for real Altegio data'
          git pull --rebase origin develop
          git push origin HEAD:develop
