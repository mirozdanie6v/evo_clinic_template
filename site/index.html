<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#f7f5f0" />
  <title>EVO Beauty Space · Nha Trang</title>
  <meta name="description" content="EVO Beauty Space cosmetology MiniApp prototype" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <button class="brand" data-go="home" aria-label="EVO Beauty Space home">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-copy"><b>EVO BEAUTY SPACE</b><small>NHA TRANG</small></span>
      </button>
      <div class="language-switch" aria-label="Language">
        <button data-lang="ru" class="active">RU</button><button data-lang="en">EN</button><button data-lang="vi">VI</button>
      </div>
    </header>

    <section id="screen-home" class="screen active"></section>
    <section id="screen-services" class="screen"></section>
    <section id="screen-booking" class="screen"></section>
    <section id="screen-ai" class="screen"></section>
    <section id="screen-profile" class="screen"></section>
    <section id="screen-specialists" class="screen"></section>
    <section id="screen-admin" class="screen"></section>

    <nav class="bottom-nav" aria-label="Main navigation">
      <button data-go="home" class="active"><span>⌂</span><b data-nav="home">Главная</b></button>
      <button data-go="services"><span>▤</span><b data-nav="services">Услуги</b></button>
      <button data-go="booking"><span>□</span><b data-nav="booking">Запись</b></button>
      <button data-go="ai"><span>✦</span><b data-nav="ai">ИИ</b></button>
      <button data-go="profile"><span>○</span><b data-nav="profile">Профиль</b></button>
    </nav>
  </main>
  <div id="modal-root"></div>
  <script src="./data.js"></script>
  <script src="./app.js"></script>
</body>
</html>
